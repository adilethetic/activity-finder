spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/adilet
    username: postgres
    password: postgres

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

  flyway:
    enabled: false

app:
  jwt:
    secret: ${JWT_SECRET:replace-with-a-random-string-at-least-32-chars}
    expiration-minutes: 120

springdoc:
  swagger-ui:
    path: /swagger-ui.html